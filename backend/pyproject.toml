[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marginalia-ai"
version = "0.1.0"
description = "Detect AI-generated peer reviews via 3-layer signal triangulation"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "httpx==0.28.1",
    "redis==5.2.1",
    "pymupdf==1.25.1",
    "sentence-transformers==3.3.1",
    "spacy==3.8.3",
    "hdbscan==0.8.40",
    "umap-learn==0.5.7",
    "scikit-learn==1.5.2",
    "numpy==1.26.4",
    "openreview-py==1.39.0",
    "arxiv==2.1.3",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "httpx==0.28.1",
]

[project.scripts]
marginalia = "marginalia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marginalia"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
